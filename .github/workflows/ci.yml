name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / .NET 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Build net8.0, net9.0, and net10.0 libraries
        shell: pwsh
        run: |
          dotnet build dotnet/Trajectory.sln -c Release --no-restore 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Test
        run: dotnet test dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj -c Release --no-build

  contracts:
    name: Contracts, schemas, and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Verify formatting and analyzers
        run: dotnet format dotnet/Trajectory.sln --verify-no-changes --no-restore
      - name: Build contract tests
        run: dotnet build dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj -c Release --no-restore
      - name: Validate manifests and schemas
        run: >-
          dotnet test dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ContractsAndConformanceTests|FullyQualifiedName~StreamingSchemaVectorTests"

  conformance:
    name: Shared conformance / .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Build .NET conformance runner
        run: >-
          dotnet build
          dotnet/tests/Trajectory.Conformance/Trajectory.Conformance.csproj
          -c Release --no-restore
      - name: Validate .NET capability manifest
        run: |
          jq -e '
            .runtime == "dotnet"
            and .slice == "ML13"
            and .normalizer_contract_version == "0.2.0"
            and .sources == ["pi", "claude-code", "codex", "openclaw", "hermes", "ahp", "grok-build"]
            and .outputs == [
              "letta-trajectory-v1",
              "letta-canonical-v1",
              "hypabolic-trajectory-v1",
              "openai-chat-messages",
              "jsonl-minimal",
              "otel-genai-spans-v1"
            ]
            and .capabilities == [
              "normalize",
              "normalize-partial",
              "list-explicit-root",
              "typed-diagnostics",
              "typed-fatal-errors",
              "deterministic-rerun",
              "stream-core",
              "stream-cursor-v1",
              "stream-jsonl-framing",
              "stream-apply-snapshot",
              "stream-apply-append",
              "stream-full-snapshot",
              "stream-record-delta",
              "stream-reset",
              "stream-provisional-records",
              "stream-deterministic-replay",
              "stream-file-jsonl",
              "stream-ahp-snapshot",
              "stream-ahp-action-log"
            ]
          ' dotnet/src/Trajectory/runtime-capabilities.json > /dev/null
      - name: Run every shared case twice
        run: |
          summary=$(python3 conformance/verify.py --repository-root . \
            --capabilities-file dotnet/src/Trajectory/runtime-capabilities.json -- \
            dotnet \
            dotnet/tests/Trajectory.Conformance/bin/Release/net10.0/trajectory-conformance.dll)
          echo "$summary"
          echo "$summary" | jq -e '.status == "success" and .stream_unsupported_skips == 0'
      - name: Upload unaccepted conformance candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-candidates
          path: artifacts/conformance-candidates
          if-no-files-found: ignore
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance
      - name: Publish Native AOT conformance runner
        run: >-
          dotnet publish
          dotnet/tests/Trajectory.Conformance/Trajectory.Conformance.csproj
          -c Release -r linux-x64 --self-contained true
      - name: Smoke Native AOT conformance protocol
        shell: bash
        run: |
          printf '%s' '{"protocol_version":"1","case":"pi/tool-calls","operation":"normalize-canonical","repository_root":"'"$PWD"'"}' \
            | ./dotnet/tests/Trajectory.Conformance/bin/Release/net10.0/linux-x64/publish/trajectory-conformance \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "success"'

  package:
    name: NuGet package contents and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Assert core has no package dependency
        shell: bash
        run: |
          dotnet list dotnet/src/Trajectory/Trajectory.csproj package --include-transitive | tee core-packages.txt
          if grep '^   >' core-packages.txt | grep -qv '(A)'; then
            echo "The core package unexpectedly has a package dependency."
            exit 1
          fi
      - name: Pack runtime libraries
        run: |
          dotnet pack dotnet/src/Trajectory/Trajectory.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack dotnet/src/Trajectory.OpenTelemetry/Trajectory.OpenTelemetry.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack dotnet/src/Trajectory.Testing/Trajectory.Testing.csproj -c Release --no-restore -o artifacts/packages
      - name: Check package contents
        run: python3 conformance/check_package.py artifacts/packages

  aot-smoke:
    name: Native AOT smoke / Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Native AOT smoke executable
        shell: pwsh
        run: |
          dotnet publish dotnet/tests/Trajectory.AotSmoke/Trajectory.AotSmoke.csproj -c Release -r linux-x64 --self-contained true 2>&1 | Tee-Object aot.log
          exit $LASTEXITCODE
      - name: Upload failed AOT log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aot-log-linux-x64
          path: aot.log
      - name: Run Native AOT smoke executable
        run: ./dotnet/tests/Trajectory.AotSmoke/bin/Release/net10.0/linux-x64/publish/Hypabolic.Trajectory.AotSmoke

  typescript:
    name: TypeScript / Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck declarations and strict sources
        run: npm run typecheck
      - name: Build all packages
        run: npm run build
      - name: Run TypeScript tests
        run: node --test test/*.test.mjs

  typescript-conformance:
    name: Shared conformance / TypeScript baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install and build TypeScript runner
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - name: Validate TypeScript capability manifest
        run: |
          jq -e '
            .runtime == "typescript"
            and .slice == "ML13"
            and .normalizer_contract_version == "0.2.0"
            and .sources == ["pi", "claude-code", "codex", "openclaw", "hermes", "ahp", "grok-build"]
            and .outputs == [
              "letta-trajectory-v1",
              "letta-canonical-v1",
              "hypabolic-trajectory-v1",
              "openai-chat-messages",
              "jsonl-minimal",
              "otel-genai-spans-v1"
            ]
            and .capabilities == [
              "normalize",
              "normalize-partial",
              "list-explicit-root",
              "typed-diagnostics",
              "typed-fatal-errors",
              "deterministic-rerun",
              "stream-core",
              "stream-cursor-v1",
              "stream-jsonl-framing",
              "stream-apply-snapshot",
              "stream-apply-append",
              "stream-full-snapshot",
              "stream-record-delta",
              "stream-reset",
              "stream-provisional-records",
              "stream-deterministic-replay",
              "stream-file-jsonl",
              "stream-ahp-snapshot",
              "stream-ahp-action-log"
            ]
          ' typescript/packages/trajectory/runtime-capabilities.json > /dev/null
      - name: Run every advertised shared case twice
        run: |
          summary=$(python3 conformance/verify.py --repository-root . \
            --capabilities-file typescript/packages/trajectory/runtime-capabilities.json -- \
            node typescript/packages/trajectory-testing/dist/cli.js)
          echo "$summary"
          echo "$summary" | jq -e '.status == "success" and .stream_unsupported_skips == 0'
      - name: Upload unaccepted conformance candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-conformance-candidates
          path: artifacts/conformance-candidates
          if-no-files-found: ignore
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance

  typescript-package-smoke:
    name: TypeScript package smoke / Node 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install, build, and test public exports
        working-directory: typescript
        run: |
          npm ci
          npm run build
          node --test test/workspace-smoke.test.mjs
      - name: Inspect package contents
        working-directory: typescript
        shell: bash
        run: |
          mkdir -p ../artifacts/npm
          npm pack --workspaces --pack-destination ../artifacts/npm
          for package in ../artifacts/npm/*.tgz; do
            tar -tzf "$package" | sort
            if tar -tzf "$package" | grep -Eq '(^|/)(src|test|node_modules)/'; then
              echo "Unexpected source, test, or dependency directory in $package"
              exit 1
            fi
          done
      - name: Install packed artifacts and import public exports
        working-directory: typescript
        shell: bash
        run: |
          install_root=$(mktemp -d)
          cd "$install_root"
          npm init -y
          npm install "$OLDPWD"/../artifacts/npm/*.tgz --ignore-scripts
          node --input-type=module -e "
            import { TrajectoryEngine } from '@hypabolic/trajectory';
            import { listTrajectories } from '@hypabolic/trajectory-node';
            import { projectOpenTelemetry } from '@hypabolic/trajectory-otel';
            if (!TrajectoryEngine || !listTrajectories || !projectOpenTelemetry) process.exit(1);
          "

  # PY-15-scaffold: unit + pack smoke (no OIDC).
  # PY-15a: progressive argv generator/checker (maps + fail-closed; still enforced).
  # PY-15b: tip equality unfiltered gate (python-conformance job at tip).
  python-unit:
    name: Python unit / ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package (editable + dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e './python[dev]'
      - name: Assert runtime-capabilities.json is present
        run: test -f python/runtime-capabilities.json
      - name: Run unit tests
        # Skip heavy unfiltered tip verify / pack-smoke join tests — those run
        # in python-conformance and python-package-smoke (avoid triple tip cost).
        run: python -m pytest python/tests -q -m "not heavy"

  # PY-15b: tip shared conformance. Capability tip equality (jq, incl. capabilities)
  # + generator --check-only (§5 maps; require proper_subset_of_tip=false) + unfiltered
  # verify (defaults from contracts/compatibility.json tip matrix). Artifact name pin:
  # python-conformance-candidates. Soft-fail is forbidden.
  python-conformance:
    name: Shared conformance / Python tip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package (editable + dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e './python[dev]'
      - name: Validate Python capability manifest (tip equality)
        run: |
          jq -e '
            .runtime == "python"
            and .slice == "ML13"
            and .normalizer_contract_version == "0.2.0"
            and .sources == ["pi", "claude-code", "codex", "openclaw", "hermes", "ahp", "grok-build"]
            and .outputs == [
              "letta-trajectory-v1",
              "letta-canonical-v1",
              "hypabolic-trajectory-v1",
              "openai-chat-messages",
              "jsonl-minimal",
              "otel-genai-spans-v1"
            ]
            and .capabilities == [
              "normalize",
              "normalize-partial",
              "list-explicit-root",
              "typed-diagnostics",
              "typed-fatal-errors",
              "deterministic-rerun",
              "stream-core",
              "stream-cursor-v1",
              "stream-jsonl-framing",
              "stream-apply-snapshot",
              "stream-apply-append",
              "stream-full-snapshot",
              "stream-record-delta",
              "stream-reset",
              "stream-provisional-records",
              "stream-deterministic-replay",
              "stream-file-jsonl",
              "stream-ahp-snapshot",
              "stream-ahp-action-log"
            ]
          ' python/runtime-capabilities.json > /dev/null
      - name: Check progressive argv maps (claimed ⊆ verified; tip equality)
        # Fail closed if coverage rules unmet, suite empty, or still ⊂ tip.
        run: |
          plan=$(python tools/conformance_argv_from_capabilities.py --repository-root . --check-only)
          echo "$plan"
          echo "$plan" | jq -e '
            .status == "ok"
            and .proper_subset_of_tip == false
            and .matched_operations > 0
          ' > /dev/null
      - name: Run every advertised shared case twice (unfiltered tip)
        # No --source/--operation: verify defaults to compatibility tip matrix.
        # LS-08: stream_unsupported_skips must be 0 (unsupported-as-skip must not green CI).
        run: |
          summary=$(python conformance/verify.py --repository-root . \
            --capabilities-file python/runtime-capabilities.json -- \
            env PYTHONPATH=python/tools python -m trajectory_conformance)
          echo "$summary"
          echo "$summary" | jq -e '.status == "success" and .stream_unsupported_skips == 0'
      - name: Upload unaccepted conformance candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-conformance-candidates
          path: artifacts/conformance-candidates
          if-no-files-found: ignore
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance

  python-package-smoke:
    name: Python package smoke / 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: python -m pip install -U pip build
      - name: Prepare, build, two-column pack-smoke, isolated install
        # PY-14a tool: prepare (overwrite) → build sdist+wheel → archive asserts
        # → Requires-Dist audit → isolated sdist/wheel install (no monorepo contracts).
        run: >-
          python tools/python_package_smoke.py
          --repository-root .
          --outdir artifacts/ci/pypi
          --python "$(command -v python)"

  rust:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [1.85.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test workspace
        run: cargo +${{ matrix.rust }} test --manifest-path rust/Cargo.toml --workspace --locked

  rust-quality:
    name: Rust formatting, lints, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify formatting
        run: cargo +stable fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --manifest-path rust/Cargo.toml --workspace --no-deps --locked
      - name: Assert core integration boundaries
        shell: bash
        run: |
          cargo +stable tree --manifest-path rust/Cargo.toml -p hypabolic-trajectory | tee rust-core-dependencies.txt
          if grep -Eiq '(^|[-_])(sqlite|opentelemetry|tokio)([-_]|$)' rust-core-dependencies.txt; then
            echo "The Rust core crate unexpectedly contains an optional integration dependency."
            exit 1
          fi
      - name: Package and verify the core crate
        run: |
          python3 tools/prepare_rust_package.py
          git check-ignore -q rust/crates/hypabolic-trajectory/contracts/compatibility.json
          test -z "$(git status --porcelain --untracked-files=all -- rust/crates/hypabolic-trajectory/contracts)"
          cargo +stable package --manifest-path rust/Cargo.toml -p hypabolic-trajectory --locked --allow-dirty
          cargo +stable package --manifest-path rust/Cargo.toml -p hypabolic-trajectory-opentelemetry --list

  rust-conformance:
    name: Shared conformance / Rust output parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build Rust conformance runner
        run: cargo +stable build --manifest-path rust/Cargo.toml --release --locked --bin trajectory-conformance
      - name: Validate Rust capability manifest
        run: |
          jq -e '
            .runtime == "rust"
            and .slice == "ML13"
            and .normalizer_contract_version == "0.2.0"
            and .sources == ["pi", "claude-code", "codex", "openclaw", "hermes", "ahp", "grok-build"]
            and .outputs == [
              "letta-trajectory-v1",
              "letta-canonical-v1",
              "hypabolic-trajectory-v1",
              "openai-chat-messages",
              "jsonl-minimal",
              "otel-genai-spans-v1"
            ]
            and .capabilities == [
              "normalize",
              "normalize-partial",
              "list-explicit-root",
              "typed-diagnostics",
              "typed-fatal-errors",
              "deterministic-rerun",
              "stream-core",
              "stream-cursor-v1",
              "stream-jsonl-framing",
              "stream-apply-snapshot",
              "stream-apply-append",
              "stream-full-snapshot",
              "stream-record-delta",
              "stream-reset",
              "stream-provisional-records",
              "stream-deterministic-replay",
              "stream-file-jsonl",
              "stream-ahp-snapshot",
              "stream-ahp-action-log"
            ]
          ' rust/crates/hypabolic-trajectory/runtime-capabilities.json > /dev/null
      - name: Run every advertised shared case and output twice
        run: |
          summary=$(python3 conformance/verify.py --repository-root . \
            --capabilities-file rust/crates/hypabolic-trajectory/runtime-capabilities.json -- \
            rust/target/release/trajectory-conformance)
          echo "$summary"
          echo "$summary" | jq -e '.status == "success" and .stream_unsupported_skips == 0'
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance

  preview-release:
    name: Preview packages, evidence, and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Validate synchronized release metadata
        run: >-
          python3 tools/validate_release_metadata.py
          --repository-root .
          --evidence artifacts/evidence/provenance.json
      - name: Restore preview builds
        run: |
          dotnet restore dotnet/Trajectory.sln
          dotnet restore dotnet/benchmarks/Trajectory.Benchmarks/Trajectory.Benchmarks.csproj
          npm ci --prefix typescript
      - name: Build and dry-run NuGet packages
        run: |
          dotnet pack dotnet/src/Trajectory/Trajectory.csproj -c Release --no-restore -o artifacts/preview/nuget
          dotnet pack dotnet/src/Trajectory.OpenTelemetry/Trajectory.OpenTelemetry.csproj -c Release --no-restore -o artifacts/preview/nuget
          dotnet pack dotnet/src/Trajectory.Testing/Trajectory.Testing.csproj -c Release --no-restore -o artifacts/preview/nuget
          consumer=$(mktemp -d)
          package_version=$(tr -d '[:space:]' < VERSION)
          dotnet new console --output "$consumer" --framework net10.0
          dotnet add "$consumer" package Hypabolic.Trajectory --version "$package_version" --source "$PWD/artifacts/preview/nuget"
          dotnet build "$consumer" --no-restore
      - name: Build and dry-run npm packages
        working-directory: typescript
        run: |
          npm run build
          mkdir -p ../artifacts/preview/npm
          # Pack only — `npm publish --dry-run` fails once a version already exists
          # on the registry (bootstrap), even though no publish occurs.
          npm pack --workspace @hypabolic/trajectory \
            --workspace @hypabolic/trajectory-node \
            --workspace @hypabolic/trajectory-otel \
            --pack-destination ../artifacts/preview/npm
          for package in ../artifacts/preview/npm/*.tgz; do
            echo "Packed $package"
            tar -tzf "$package" | head -20
          done
      - name: Build and dry-run crates
        run: |
          python3 tools/prepare_rust_package.py
          git check-ignore -q rust/crates/hypabolic-trajectory/contracts/compatibility.json
          test -z "$(git status --porcelain --untracked-files=all -- rust/crates/hypabolic-trajectory/contracts)"
          cargo +stable package --manifest-path rust/Cargo.toml -p hypabolic-trajectory --locked --allow-dirty
          cargo +stable package --manifest-path rust/Cargo.toml \
            -p hypabolic-trajectory-opentelemetry --list \
            > artifacts/evidence/rust-otel-package-files.txt
          mkdir -p artifacts/preview/crates
          cp rust/target/package/*.crate artifacts/preview/crates/
      - name: Generate dependency inventories and package checksums
        shell: bash
        run: |
          dotnet list dotnet/Trajectory.sln package --include-transitive --format json > artifacts/evidence/dotnet-packages.json
          (cd typescript && npm sbom --sbom-format cyclonedx) > artifacts/evidence/npm.cdx.json
          cargo +stable metadata --manifest-path rust/Cargo.toml --format-version 1 --locked > artifacts/evidence/cargo-metadata.json
          find artifacts/preview -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/evidence/package-sha256.txt
      - name: Run representative measurements
        run: |
          mkdir -p artifacts/benchmarks
          dotnet run --project dotnet/benchmarks/Trajectory.Benchmarks/Trajectory.Benchmarks.csproj -c Release --no-restore > artifacts/benchmarks/dotnet.json
          npm run --prefix typescript benchmark > artifacts/benchmarks/typescript.json
          cargo +stable run --manifest-path rust/Cargo.toml -p hypabolic-trajectory --example benchmark --release --locked > artifacts/benchmarks/rust.json
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: ml13-preview-release
          path: artifacts
