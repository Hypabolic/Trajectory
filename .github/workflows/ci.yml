name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / .NET 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Trajectory.sln
      - name: Build all library target frameworks
        shell: pwsh
        run: |
          dotnet build Trajectory.sln -c Release --no-restore 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Test
        run: dotnet test tests/Trajectory.Tests/Trajectory.Tests.csproj -c Release --no-build

  aot-smoke:
    name: Native AOT smoke / Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Native AOT smoke executable
        shell: pwsh
        run: |
          dotnet publish tests/Trajectory.AotSmoke/Trajectory.AotSmoke.csproj -c Release -r linux-x64 --self-contained true 2>&1 | Tee-Object aot.log
          exit $LASTEXITCODE
      - name: Upload AOT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-log-linux-x64
          path: aot.log
      - name: Run Native AOT smoke executable
        run: ./tests/Trajectory.AotSmoke/bin/Release/net10.0/linux-x64/publish/Hypabolic.Trajectory.AotSmoke
