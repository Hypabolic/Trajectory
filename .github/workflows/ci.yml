name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / .NET 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Build net8.0, net9.0, and net10.0 libraries
        shell: pwsh
        run: |
          dotnet build dotnet/Trajectory.sln -c Release --no-restore 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Test
        run: dotnet test dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj -c Release --no-build

  contracts:
    name: Contracts, schemas, and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Verify formatting and analyzers
        run: dotnet format dotnet/Trajectory.sln --verify-no-changes --no-restore
      - name: Build contract tests
        run: dotnet build dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj -c Release --no-restore
      - name: Validate manifests and schemas
        run: >-
          dotnet test dotnet/tests/Trajectory.Tests/Trajectory.Tests.csproj
          -c Release --no-build
          --filter FullyQualifiedName~ContractsAndConformanceTests

  conformance:
    name: Shared conformance / .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Build .NET conformance runner
        run: >-
          dotnet build
          dotnet/tests/Trajectory.Conformance/Trajectory.Conformance.csproj
          -c Release --no-restore
      - name: Run every shared case twice
        run: >-
          python3 conformance/verify.py --repository-root . --
          dotnet
          dotnet/tests/Trajectory.Conformance/bin/Release/net10.0/trajectory-conformance.dll
      - name: Upload unaccepted conformance candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-candidates
          path: artifacts/conformance-candidates
          if-no-files-found: ignore
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance
      - name: Publish Native AOT conformance runner
        run: >-
          dotnet publish
          dotnet/tests/Trajectory.Conformance/Trajectory.Conformance.csproj
          -c Release -r linux-x64 --self-contained true
      - name: Smoke Native AOT conformance protocol
        shell: bash
        run: |
          printf '%s' '{"protocol_version":"1","case":"pi/tool-calls","operation":"normalize-canonical","repository_root":"'"$PWD"'"}' \
            | ./dotnet/tests/Trajectory.Conformance/bin/Release/net10.0/linux-x64/publish/trajectory-conformance \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "success"'

  package:
    name: NuGet package contents and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore dotnet/Trajectory.sln
      - name: Assert core has no package dependency
        shell: bash
        run: |
          dotnet list dotnet/src/Trajectory/Trajectory.csproj package --include-transitive | tee core-packages.txt
          if grep '^   >' core-packages.txt | grep -qv '(A)'; then
            echo "The core package unexpectedly has a package dependency."
            exit 1
          fi
      - name: Pack runtime libraries
        run: |
          dotnet pack dotnet/src/Trajectory/Trajectory.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack dotnet/src/Trajectory.OpenTelemetry/Trajectory.OpenTelemetry.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack dotnet/src/Trajectory.Testing/Trajectory.Testing.csproj -c Release --no-restore -o artifacts/packages
      - name: Check package contents
        run: python3 conformance/check_package.py artifacts/packages

  aot-smoke:
    name: Native AOT smoke / Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Native AOT smoke executable
        shell: pwsh
        run: |
          dotnet publish dotnet/tests/Trajectory.AotSmoke/Trajectory.AotSmoke.csproj -c Release -r linux-x64 --self-contained true 2>&1 | Tee-Object aot.log
          exit $LASTEXITCODE
      - name: Upload failed AOT log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aot-log-linux-x64
          path: aot.log
      - name: Run Native AOT smoke executable
        run: ./dotnet/tests/Trajectory.AotSmoke/bin/Release/net10.0/linux-x64/publish/Hypabolic.Trajectory.AotSmoke

  typescript:
    name: TypeScript / Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck declarations and strict sources
        run: npm run typecheck
      - name: Build all packages
        run: npm run build
      - name: Run TypeScript tests
        run: node --test test/*.test.mjs

  typescript-conformance:
    name: Shared conformance / TypeScript baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install and build TypeScript runner
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - name: Run every advertised shared case twice
        run: >-
          python3 conformance/verify.py --repository-root . --
          node typescript/packages/trajectory-testing/dist/cli.js
      - name: Upload unaccepted conformance candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-conformance-candidates
          path: artifacts/conformance-candidates
          if-no-files-found: ignore
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance

  typescript-package-smoke:
    name: TypeScript package smoke / Node 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install, build, and test public exports
        working-directory: typescript
        run: |
          npm ci
          npm run build
          node --test test/workspace-smoke.test.mjs
      - name: Inspect package contents
        working-directory: typescript
        shell: bash
        run: |
          mkdir -p ../artifacts/npm
          npm pack --workspaces --pack-destination ../artifacts/npm
          for package in ../artifacts/npm/*.tgz; do
            tar -tzf "$package" | sort
            if tar -tzf "$package" | grep -Eq '(^|/)(src|test|node_modules)/'; then
              echo "Unexpected source, test, or dependency directory in $package"
              exit 1
            fi
          done
      - name: Install packed artifacts and import public exports
        working-directory: typescript
        shell: bash
        run: |
          install_root=$(mktemp -d)
          npm init --prefix "$install_root" -y
          npm install --prefix "$install_root" "$PWD"/../artifacts/npm/*.tgz --ignore-scripts
          cd "$install_root"
          node --input-type=module -e "
            import { TrajectoryEngine } from '@hypabolic/trajectory';
            import { listTrajectories } from '@hypabolic/trajectory-node';
            import { projectOpenTelemetry } from '@hypabolic/trajectory-otel';
            if (!TrajectoryEngine || !listTrajectories || !projectOpenTelemetry) process.exit(1);
          "

  rust:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [1.85.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test workspace
        run: cargo +${{ matrix.rust }} test --manifest-path rust/Cargo.toml --workspace --locked

  rust-quality:
    name: Rust formatting, lints, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify formatting
        run: cargo +stable fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --manifest-path rust/Cargo.toml --workspace --no-deps --locked
      - name: Assert core integration boundaries
        shell: bash
        run: |
          cargo +stable tree --manifest-path rust/Cargo.toml -p hypabolic-trajectory | tee rust-core-dependencies.txt
          if grep -Eiq '(^|[-_])(sqlite|opentelemetry|tokio)([-_]|$)' rust-core-dependencies.txt; then
            echo "The Rust core crate unexpectedly contains an optional integration dependency."
            exit 1
          fi
      - name: Package and verify the core crate
        working-directory: rust
        run: cargo +stable package -p hypabolic-trajectory --locked

  rust-conformance:
    name: Shared conformance / Rust Pi + Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build Rust conformance runner
        run: cargo +stable build --manifest-path rust/Cargo.toml --release --locked --bin trajectory-conformance
      - name: Validate Rust capability manifest
        run: >-
          jq -e
          '.runtime == "rust" and .slice == "ML5"
          and .normalizer_contract_version == "0.2.0"
          and .sources == ["pi", "claude-code"]
          and .outputs == ["letta-trajectory-v1", "letta-canonical-v1", "hypabolic-trajectory-v1"]'
          rust/runtime-capabilities.json > /dev/null
      - name: Run every ML5 shared Pi and Claude Code operation twice
        shell: bash
        run: |
          for source in pi claude-code; do
            python3 conformance/verify.py --repository-root . --source "$source" \
              --operation normalize-letta \
              --operation normalize-canonical \
              --operation normalize-hypabolic \
              --operation list-trajectories -- \
              rust/target/release/trajectory-conformance
          done
      - name: Prove checked-in identity goldens are unchanged
        run: sha256sum --check conformance/identity-baseline.sha256
      - name: Reject fixture mutation
        run: git diff --exit-code -- contracts conformance
