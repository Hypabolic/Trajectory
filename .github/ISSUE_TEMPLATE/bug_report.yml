name: Bug report
description: Something is wrong or unexpected in Trajectory
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please **sanitize** all fixtures—never paste
        production transcripts, API keys, tokens, or personal data.
        See [contributing](https://github.com/Hypabolic/Trajectory/blob/main/docs/contributing.md).

  - type: dropdown
    id: package
    attributes:
      label: Package / runtime
      description: Where you observed the issue
      multiple: true
      options:
        - .NET (Hypabolic.Trajectory)
        - TypeScript (@hypabolic/trajectory)
        - TypeScript Node listing (@hypabolic/trajectory-node)
        - Rust (hypabolic-trajectory)
        - OpenTelemetry package (.NET / npm / crates)
        - Sample CLI
        - Conformance / contracts
        - Documentation only
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: e.g. 0.1.0, or commit SHA if building from source
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source family (if relevant)
      options:
        - Not applicable
        - pi
        - claude-code
        - codex
        - openclaw
        - hermes
        - Multiple / unknown
    validations:
      required: true

  - type: dropdown
    id: input_kind
    attributes:
      label: Input kind
      options:
        - Not applicable
        - Whole session file
        - Partial / chunked
        - Listing only (no normalize)
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Actual behaviour (error message, wrong projection, wrong listing, etc.)
      placeholder: |
        e.g. Canonical record ids differ from the shared golden for the same input.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Expected behaviour, ideally in terms of schemas, diagnostics codes, or hashes
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Steps, a tiny **sanitized** fixture, or a link to a gist/PR.
        Prefer a shared-case-style JSONL snippet over full private sessions.
      placeholder: |
        1. Save the following as session.jsonl …
        2. Run: …
        3. Observe: …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version (dotnet / node / rustc), and anything special about the store root
      placeholder: |
        - OS: macOS 15
        - .NET SDK: 10.0.x
        - Node: 24
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: Any attached fixtures are sanitized (no secrets or personal data)
          required: true
