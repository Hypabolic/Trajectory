[package]
name = "trajectory-cli"
description = "Local sample TUI for browsing agent sessions with hypabolic-trajectory"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trajectory"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.28", features = ["derive", "env"] }
dialoguer = { version = "0.11.0", default-features = true }
hypabolic-trajectory = { path = "../../crates/hypabolic-trajectory" }
hypabolic-trajectory-ahp = { path = "../../crates/hypabolic-trajectory-ahp" }
hypabolic-trajectory-io = { path = "../../crates/hypabolic-trajectory-io" }
serde_json.workspace = true

[lints]
workspace = true
